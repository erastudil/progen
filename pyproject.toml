[project]
name = "progen-dialect"
version = "1.1.0"
description = "progen dialect specification and tooling"
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.10"
authors = [{ name = "Humans and AI" }]
keywords = ["agents", "dialect", "prompt", "agpl"]
classifiers = [
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing",
]

[project.urls]
Homepage = "https://github.com/erastudil/progen"
License = "https://github.com/erastudil/progen/blob/main/LICENSE"

[project.scripts]
progen = "progen.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
progen = ["data/*", "data/**/*"]

