name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: unittest
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: cli check
        run: PYTHONPATH=src python -m progen check
      - name: genome emits
        run: PYTHONPATH=src python -m progen prompt genome | grep -q "agents iron"
